server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sitio de bajo tráfico que se redespliega a menudo: mejor evitar que
    # Cloudflare sirva JS/HTML viejo en caché tras un deploy que ganar el
    # rendimiento marginal de cachear un sitio tan pequeño.
    add_header Cache-Control "no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ =404;
    }
}
